name: Checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r executor/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Syntax and JavaScript unit tests
        run: |
          npm run check
          npm test
      - name: Offline executor tests with real FFmpeg
        run: python -m unittest discover -s tests -p 'executor_*.py'
      - name: Read-only health contract
        run: npm run test:health
